seed: 42

data:
  csv_path: data/ABB_5minute_cleaned_features.csv
  time_col: "Unnamed: 0"
  feature_cols: [open, high, low, close, volume, log_return, hl_range, tod_sin, tod_cos]
  train_ratio: 0.90
  val_ratio: 0.15
  test_ratio: 0.15
  lin: 256
  stride: 16
  target_h: 12

  #Entropy filtering setting
  entropy_filtering: True
  entropy_q = 0.7
  entropy_bins: 11

model:
  hidden_dim: 256
  proj_dim: 128
  depth: 6

train:
  batch_size: 16
  epochs: 10
  lr: 0.001
  weight_decay: 0.0001
  temperature: 0.3
  mask_ratio: 0.2
  noise_std: 0.01
  device: mps

paths:
  out_dir: ./outputs/ts2vec_baseline