seed: 42

data:
  csv_path: data/ABB_5minute_cleaned_features.csv
  time_col: "Unnamed: 0"
  feature_cols: [open, high, low, close, volume, log_return, hl_range, tod_sin, tod_cos]
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  lin: 256
  stride: 16
  target_h: 12

  #Entropy filtering setting
  entropy_filter: false
  entropy_q : 0.95 # Quantile threshold for entropy filtering, drop the 10% tails
  entropy_bins: 11

model:
  hidden_dim: 32
  proj_dim: 16
  depth: 2

train:
  batch_size: 128
  epochs: 15
  patience: 4
  min_improvement: 0.01
  lr: 0.0002
  weight_decay: 0.1
  temperature: 0.15
  mask_ratio: 0.4
  noise_std: 0.03
  entropy_weighted: false
  weight_clip: [0.5, 1.5] # Min and max weights for entropy weighting
  device: mps

paths:
  windows_root : outputs/windows_clean
  out_dir: ./outputs/ts2vec_entropy
  ckpt_name: ts2vec_entropy.ckpt